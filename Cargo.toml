[package]
name = "kyanite-core"
description = "The core library for the kyanite project"
authors = ["Kyanite Project <contact@kyanite.mov>"]
version = "1.0.0-alpha.2"
rust-version = "1.98.0"
edition = "2024"

license = "GPL-3.0-or-later"
homepage = "https://kyanite.mov"
repository = "https://github.com/Akeoott/kyanite-core"

keywords = ["system", "kernel", "hardware", "telemetry", "process-management"]
categories = ["os", "command-line-utilities", "hardware-support", "filesystem"]

exclude = [
    ".github/",
    ".vscode/",
    ".editorconfig",
    ".gitignore",
    ".gitattributes",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
full = ["telemetry"]
telemetry = []

[[example]]
name = "telemetry"
required-features = ["telemetry"]

[dev-dependencies]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
rayon = "1.12.0"
log = "0.4.34"
env_logger = "0.11.11"
